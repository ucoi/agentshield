[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "A security runtime for sandboxed autonomous AI agents"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0"
]

[tool.setuptools.packages.find]
include = ["agentshield*"]